[package]
name = "nova"
version = "0.3.0"
edition = "2021"
repository = "https://github.com/jcarbonnell/nova"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
near-sdk = "5.17.2"
borsh = { version = "1.5.0", features = ["unstable__schema"] }
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8.22"
serde_json = "1.0.145"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
near-sdk = { version = "5.17.2", features = ["unit-testing"] }
near-workspaces = { version = "0.21", features = ["unstable"] }
tokio = { version = "1.12.0", features = ["full"] }
near-crypto = "0.23.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = false
rpath = false
[profile.release.build-override]
opt-level = 3

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.5-rust-1.85.1"
image_digest = "sha256:3b0272ecdbb91465f3e7348330d7f2d031d27901f26fb25b4eaf1560a60c20f3"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]