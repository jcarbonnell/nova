schema_version = "reborn.extension_manifest.v3"
id = "nova"
name = "NOVA"
version = "0.1.1"
description = "NOVA capabilities for IronClaw Reborn: store/retrieve encrypted files and manage groups on NEAR, calling the NOVA MCP API. The NOVA API key is host-injected on the session-token exchange; the minted session token is carried by the tool to the MCP host."
# Imported bundles may not claim first-party trust (ironclaw_extension_host:
# imported_extension_package_rejects_first_party_trust_claims).
trust = "third_party"

[runtime]
kind = "wasm"
module = "wasm/nova_reborn.wasm"

# NOVA auth is two-leg:
#   Leg 1: the NOVA API key is host-injected as X-API-Key on the session-token
#          request to nova-sdk.com (the [[tools.credentials]] block below; the
#          audience host is allowed implicitly).
#   Leg 2: the tool carries the minted session JWT as its own Bearer header to
#          the MCP host (network target below, no credential injection).
[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "nova.store_file"
description = "Encrypt a UTF-8 text file with AES-256-GCM and upload it to a NOVA group on NEAR, under the agent's own NOVA account. Verifies content against the provided sha256 before any network call."
effects = ["network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
input_schema_ref = "schemas/nova/store_file.input.v1.json"
prompt_doc_ref = "prompts/nova/store_file.md"
network_targets = [
  { scheme = "https", host_pattern = "5a5223f7d1bfe777433c496b9d52ff851e927259-8000.dstack-prod5.phala.network" },
]

[[tools.credentials]]
handle = "nova_api_key"
vendor = "nova"
audience = { scheme = "https", host = "nova-sdk.com" }
injection = { type = "header", name = "X-API-Key", prefix = "" }
placeholder_env = "NOVA_API_KEY"

[auth.nova]
method = "api_key"
display_name = "NOVA API key"
fields = [ { handle = "nova_api_key", label = "NOVA API key (from nova-sdk.com)", secret = true } ]