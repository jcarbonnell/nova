vendor = "nova"
audience = { scheme = "https", host = "5a5223f7d1bfe777433c496b9d52ff851e927259-8000.dstack-prod5.phala.network" }
injection = { type = "header", name = "X-API-Key", prefix = "" }
placeholder_env = "NOVA_API_KEY"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "nova.join_group"
description = "Join an open NOVA group (one whose owner opened a join window). Succeeds without change if already a member. Costs a small NEAR join fee."
effects = ["network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
input_schema_ref = "schemas/nova/join_group.input.v1.json"
prompt_doc_ref = "prompts/nova/join_group.md"
network_targets = [ { scheme = "https", host_pattern = "5a5223f7d1bfe777433c496b9d52ff851e927259-8000.dstack-prod5.phala.network" } ]

[[tools.credentials]]
handle = "nova_api_key"
vendor = "nova"
audience = { scheme = "https", host = "5a5223f7d1bfe777433c496b9d52ff851e927259-8000.dstack-prod5.phala.network" }
injection = { type = "header", name = "X-API-Key", prefix = "" }
placeholder_env = "NOVA_API_KEY"

# ── owner tools (the dashboard keeps these disabled for fleet agents) ────────

