services:
  # always have shade-agent-api first in order of services
  shade-agent-api:
    environment:
      NEAR_ACCOUNT_ID: ${NEAR_ACCOUNT_ID}
      NEAR_SEED_PHRASE: ${NEAR_SEED_PHRASE}
      NEAR_RPC_JSON: ${NEAR_RPC_JSON}
      API_CODEHASH: ${API_CODEHASH}
      APP_CODEHASH: ${APP_CODEHASH}
      NEXT_PUBLIC_contractId: ${NEXT_PUBLIC_contractId}
    platform: linux/amd64 # Explicitly set for TDX
    # shade-agent-api-image
    image: mattdlockyer/shade-agent-api@sha256:a86e3a4300b069c08d629a38d61a3d780f7992eaf36aa505e4527e466553e2e5
    container_name: shade-agent-api
    # DO NOT EXPOSE THE API PORT TO THE PUBLIC
    volumes:
      - /var/run/tappd.sock:/var/run/tappd.sock
    restart: always

  shade-agent-app:
    environment:
      NEXT_PUBLIC_contractId: ${NEXT_PUBLIC_contractId}
      NEAR_RPC_URL: ${NEAR_RPC_URL}
      KV_CONTRACT_ID: ${KV_CONTRACT_ID}
      NOVA_CONTRACT_ID: ${NOVA_CONTRACT_ID}
      NOVA_TESTNET_CONTRACT_ID: ${NOVA_TESTNET_CONTRACT_ID}
      SHADE_AGENT_ACCOUNT_ID: ${SHADE_AGENT_ACCOUNT_ID}
      NOVA_SIGNER_ACCOUNT_ID: ${NOVA_SIGNER_ACCOUNT_ID}
      TEE_KEY_SECRET: ${TEE_KEY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
    platform: linux/amd64 # Explicitly set for TDX
    # shade-agent-app-image – update tag to your new build (v7 or main)
    image: jcarbonnell/nova-shade-agent:v23
    container_name: shade-agent-app
    ports:
      - "3000:3000"
    volumes:
      - /var/run/tappd.sock:/var/run/tappd.sock
    restart: always

  nova-mcp:
    environment:
      # Internal Docker hostname — resolves within same CVM, no public URL needed
      SHADE_API_URL: http://shade-agent-app:3000
      CONTRACT_ID: ${NOVA_CONTRACT_ID}
      TESTNET_CONTRACT_ID: ${NOVA_TESTNET_CONTRACT_ID}
      RPC_URL: ${NEAR_RPC_URL}
      TESTNET_RPC_URL: https://rpc.testnet.near.org
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET}
      PINATA_GATEWAY: ${PINATA_GATEWAY}
      IPFS_API_KEY: ${IPFS_API_KEY}
      IPFS_API_SECRET: ${IPFS_API_SECRET}
    platform: linux/amd64
    image: jcarbonnell/nova-mcp:v8
    container_name: nova-mcp
    ports:
      - "8000:8000"
    depends_on:
      - shade-agent-app
    restart: always
    # No tappd.sock — MCP server does not perform TDX attestation